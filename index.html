            highlightLayer = e.target;

                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {

              });

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

/* ================= DASHBOARD ANTAM ================= */

/* HEADER */
#dashboard-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 90px;
    background: linear-gradient(135deg,#001f1f,#003b3b);
    color: white;
    display: flex;

    z-index: 9000;
    border-bottom: 2px solid #00a6a6;
}

/* JUDUL */
#dashboard-title {
    margin-left: 65px;
}

#dashboard-title h1 {

    font-size: 24px;
    font-weight: 700;
}

}

}

    transition: .2s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    left: 2px;
    top: 2px;
    background: white;
    border-radius: 50%;
    transition: .2s;
}

.switch input:checked + .slider {
    background: #00a6a6;
}

.switch input:checked + .slider:before {
    transform: translateX(18px);
}

/* FILTER */
#jenis-jalan-filter {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 5px;

    color: white;
}

/* LEGEND */
.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;

}

.legend-line {
    display: inline-block;
    width: 28px;

}

.jalan-arteri {
    background: #e31a1c;
}

.jalan-kolektor {
    background: #ff7f00;
}

.jalan-lokal {
    background: #33a02c;
}

.jalan-evakuasi {

}

/* STATISTICS */
#dashboard-stats {
    position: fixed;
    top: 105px;
    left: 290px;
    right: 20px;
    z-index: 8000;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;

}

.stat-card {

}

.stat-title {

}

.stat-value {
    margin-top: 4px;

    font-weight: 800;
}

/* MOBILE */
@media(max-width:900px) {

    #dashboard-stats {
        left: 285px;
        grid-template-columns: repeat(2,1fr);
    }

}

@media(max-width:650px) {

    #dashboard-title h1 {

#tutup-tentang {

}

<script>
/* =========================================================
   DASHBOARD ANTAM
   CONNECT TO DATA TERBARU
   ========================================================= */

(function () {

    "use strict";


    /* =====================================================
       1. TUNGGU PETA TERBARU SELESAI
       ===================================================== */

    function tungguPeta(callback) {

        if (
            typeof map !== "undefined" &&
            typeof layer_Rute_Antam_1 !== "undefined"
        ) {
            callback();
            return;
        }

        setTimeout(function () {
            tungguPeta(callback);
        }, 200);

    }


    /* =====================================================
       2. BUAT DASHBOARD
       ===================================================== */

    function buatDashboard() {

        if (
            document.getElementById(
                "dashboard-header"
            )
        ) {
            return;
        }


        /* ================= BUTTON ================= */

        var button =
            document.createElement("button");

        button.id =
            "sidebar-toggle";

        button.innerHTML =
            "☰";

        button.title =
            "Tampilkan / sembunyikan dashboard";

        document.body.appendChild(button);


        /* ================= SIDEBAR ================= */

        var sidebar =
            document.createElement("div");

        sidebar.id =
            "sidebar";

        sidebar.innerHTML = `

            <div id="sidebar-header">

 <img
    id="sidebar-logo"
    alt="Logo Antam"
    style="width:150px;height:75px;object-fit:contain;"
>

            </div>


            <div class="sidebar-section">

                <div class="sidebar-title">
                    MENU
                </div>


                <div class="sidebar-menu active">
                    <span>⌂</span>
                    <span>Dashboard</span>
                </div>


                <div class="sidebar-menu">
                    <span>🗺</span>
                    <span>Peta</span>
                </div>


                <div class="sidebar-menu">
                    <span>♟</span>
                    <span>Jalur Evakuasi</span>
                </div>


                <div class="sidebar-menu">
                    <span>📍</span>
                    <span>Titik Kumpul</span>
                </div>


                <div class="sidebar-menu">
                    <span>♟</span>
                    <span>Fasilitas</span>
                </div>


                <div class="sidebar-menu">
                    <span>▤</span>
                    <span>Data & Tabel</span>
                </div>


                <div class="sidebar-menu"> id="menu-tentang">
                    <span>ⓘ</span>
                    <span>Tentang</span>
                </div>

            </div>


            <!-- FILTER LAYER -->

            <div class="sidebar-section">

                <div class="sidebar-title">
                    FILTER LAYER
                </div>


                <div class="filter-row">

                    <span>
                        Jaringan Jalan
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="toggle-rute"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="filter-row">

                    <span>
                        Jalur Evakuasi
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="toggle-jalur"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="filter-row">

                    <span>
                        Titik Kumpul
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="toggle-kumpul"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="filter-row">

                    <span>
                        Fasilitas
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="toggle-fasilitas"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="filter-row">

                    <span>
                        Administrasi
                    </span>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="toggle-admin"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>


            <!-- FILTER JENIS JALAN -->

            <div class="sidebar-section">

                <div class="sidebar-title">
                    FILTER JENIS JALAN
                </div>

                <select
                    id="jenis-jalan-filter"
                >

                    <option value="Semua Jenis">
                        Semua Jenis
                    </option>

                </select>

            </div>


            <!-- LEGENDA -->

            <div class="sidebar-section">

                <div class="sidebar-title">
                    LEGENDA
                </div>


                <div class="legend-item">
                    <span class="legend-line jalan-arteri"></span>
                    <span>Jalan Arteri</span>
                </div>


                <div class="legend-item">
                    <span class="legend-line jalan-kolektor"></span>
                    <span>Jalan Kolektor</span>
                </div>


                <div class="legend-item">
                    <span class="legend-line jalan-lokal"></span>
                    <span>Jalan Lokal</span>
                </div>


                <div class="legend-item">
                    <span class="legend-line jalan-evakuasi"></span>
                    <span>Jalur Evakuasi</span>
                </div>


                <div class="legend-item">
                    <span>📍</span>
                    <span>Titik Kumpul</span>
                </div>


                <div class="legend-item">
                    <span>🏥</span>
                    <span>Fasilitas Kesehatan</span>
                </div>


                <div class="legend-item">
                    <span>🏫</span>
                    <span>Fasilitas Pendidikan</span>
                </div>


                <div class="legend-item">
                    <span>🏢</span>
                    <span>Kantor / Pemerintahan</span>
                </div>

            </div>

        `;

        document.body.appendChild(sidebar);
		var tentangModal = document.createElement("div");
tentangModal.id = "tentang-modal";

tentangModal.innerHTML = `
    <div class="tentang-box">
        <button id="tutup-tentang">×</button>

        <h2>Tentang WebGIS</h2>

        <p>
            WebGIS ini merupakan media informasi spasial
            untuk mendukung penyajian peta dan informasi
            terkait jalur evakuasi tambang.
        </p>
    </div>
`;

document.body.appendChild(tentangModal);
document.getElementById("menu-tentang").addEventListener("click", function () {
    tentangModal.classList.add("aktif");
});

document.getElementById("tutup-tentang").addEventListener("click", function () {
    tentangModal.classList.remove("aktif");
});

        /* ================= HEADER ================= */

        var header =
            document.createElement("div");

        header.id =
            "dashboard-header";

        header.innerHTML = `

            <div id="dashboard-title">

                <h1>
                    Dashboard WebGIS Antam Pongkor
                </h1>

                <p>
                    Jaringan Jalan & Evakuasi Tambang
                </p>

            </div>


            <div id="dashboard-datetime">

                <div id="dashboard-date">
                    -
                </div>

                <div id="dashboard-time">
                    -
                </div>

            </div>

        `;

        document.body.appendChild(header);


        /* ================= STATISTIK ================= */

        var stats =
            document.createElement("div");

        stats.id =
            "dashboard-stats";

        stats.innerHTML = `

            <div class="stat-card">

                <div class="stat-title">
                    Total Ruas Jalan
                </div>

                <div
                    class="stat-value"
                    id="total-ruas"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Total Panjang Jalan
                </div>

                <div
                    class="stat-value"
                    id="total-panjang"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Total Drive Time
                </div>

                <div
                    class="stat-value"
                    id="total-drive-time"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Rata-rata Drive Time
                </div>

                <div
                    class="stat-value"
                    id="rata-drive-time"
                >
                    -
                </div>

            </div>

        `;

        document.body.appendChild(stats);


        /* =================================================
           3. TOGGLE SIDEBAR
           ================================================= */

        button.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle(
                    "dashboard-hidden"
                );

                setTimeout(
                    function () {

                        if (
                            typeof map !==
                            "undefined"
                        ) {

                            map.invalidateSize();

                        }

                    },
                    300
                );

            }
        );


        /* =================================================
           4. ISI FILTER JENIS JALAN DARI DATA BARU
           ================================================= */

        var filter =
            document.getElementById(
                "jenis-jalan-filter"
            );


        if (
            typeof json_Rute_Antam_1 !==
            "undefined"
        ) {

            var jenis =
                new Set();


            json_Rute_Antam_1.features
                .forEach(
                    function (feature) {

                        var p =
                            feature.properties ||
                            {};

                        var value =
                            p["Jenis_Jala"];


                        if (
                            value !==
                            null &&
                            value !==
                            undefined &&
                            String(value)
                                .trim() !== ""
                        ) {

                            jenis.add(
                                String(value)
                            );

                        }

                    }
                );


            Array.from(jenis)
                .sort()
                .forEach(
                    function (value) {

                        var option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            value;

                        option.textContent =
                            value;

                        filter.appendChild(
                            option
                        );

                    }
                );

        }


        /* =================================================
           5. FILTER JENIS JALAN
           ================================================= */

        filter.addEventListener(
            "change",
            function () {

                var selected =
                    this.value;


                if (
                    typeof layer_Rute_Antam_1 ===
                    "undefined"
                ) {
                    return;
                }


                layer_Rute_Antam_1.eachLayer(
                    function (layer) {

                        if (
                            !layer.feature
                        ) {
                            return;
                        }


                        var p =
                            layer.feature
                                .properties ||
                            {};


                        var value =
                            String(
                                p["Jenis_Jala"] ??
                                ""
                            );


                        var tampil =
                            selected ===
                            "Semua Jenis" ||
                            value ===
                            selected;


                        if (
                            layer.setStyle
                        ) {

                            layer.setStyle({

                                opacity:
                                    tampil
                                        ? 1
                                        : 0,

                                fillOpacity:
                                    tampil
                                        ? 1
                                        : 0

                            });

                        }

                    }
                );


                updateStatistics();

            }
        );


        /* =================================================
           6. FUNGSI TOGGLE LAYER
           ================================================= */

        function toggleLayer(
            layer,
            tampil
        ) {

            if (
                typeof map ===
                "undefined" ||
                !layer
            ) {
                return;
            }


            if (
                tampil &&
                !map.hasLayer(layer)
            ) {

                map.addLayer(layer);

            }


            if (
                !tampil &&
                map.hasLayer(layer)
            ) {

                map.removeLayer(layer);

            }

        }


        document
            .getElementById("toggle-rute")
            .addEventListener(
                "change",
                function () {

                    toggleLayer(
                        layer_Rute_Antam_1,
                        this.checked
                    );

                }
            );


        document
            .getElementById("toggle-jalur")
            .addEventListener(
                "change",
                function () {

                    toggleLayer(
                        layer_JALUR_TITIK_KUMPUL_2,
                        this.checked
                    );

                }
            );


        document
            .getElementById("toggle-kumpul")
            .addEventListener(
                "change",
                function () {

                    toggleLayer(
                        layer_TITIK_KUMPUL_Sementara_3,
                        this.checked
                    );

                }
            );


        document
            .getElementById("toggle-fasilitas")
            .addEventListener(
                "change",
                function () {

                    toggleLayer(
                        layer_new_layer_5,
                        this.checked
                    );

                }
            );


        document
            .getElementById("toggle-admin")
            .addEventListener(
                "change",
                function () {

                    toggleLayer(
                        layer_Titik_Admin_4,
                        this.checked
                    );

                }
            );


        /* =================================================
           7. STATISTIK DATA BARU
           ================================================= */

        function updateStatistics() {

            if (
                typeof layer_Rute_Antam_1 ===
                "undefined"
            ) {
                return;
            }


            var selected =
                document.getElementById(
                    "jenis-jalan-filter"
                ).value;


            var totalRuas = 0;

            var totalPanjang = 0;

            var totalDriveTime = 0;


            layer_Rute_Antam_1.eachLayer(
                function (layer) {

                    if (
                        !layer.feature
                    ) {
                        return;
                    }


                    var p =
                        layer.feature
                            .properties ||
                        {};


                    var jenis =
                        String(
                            p["Jenis_Jala"] ??
                            ""
                        );


                    if (
                        selected !==
                        "Semua Jenis" &&
                        jenis !==
                        selected
                    ) {

                        return;

                    }


                    totalRuas++;


                    var panjang =
                        Number(
                            p["Shape_Length"]
                        );


                    if (
                        Number.isFinite(
                            panjang
                        )
                    ) {

                        totalPanjang +=
                            panjang;

                    }


                    var drive =
                        Number(
                            p["Drive_Time"]
                        );


                    if (
                        Number.isFinite(
                            drive
                        )
                    ) {

                        totalDriveTime +=
                            drive;

                    }

                }
            );


            var rata =
                totalRuas > 0
                    ? totalDriveTime /
                      totalRuas
                    : 0;


            document
                .getElementById(
                    "total-ruas"
                )
                .textContent =
                    totalRuas.toLocaleString(
                        "id-ID"
                    );


            document
                .getElementById(
                    "total-panjang"
                )
                .textContent =
                    (
                        totalPanjang /
                        1000
                    ).toLocaleString(
                        "id-ID",
                        {
                            minimumFractionDigits:
                                2,
                            maximumFractionDigits:
                                2
                        }
                    ) + " km";


            document
                .getElementById(
                    "total-drive-time"
                )
                .textContent =
                    totalDriveTime.toLocaleString(
                        "id-ID",
                        {
                            minimumFractionDigits:
                                2,
                            maximumFractionDigits:
                                2
                        }
                    ) + " min";


            document
                .getElementById(
                    "rata-drive-time"
                )
                .textContent =
                    rata.toLocaleString(
                        "id-ID",
                        {
                            minimumFractionDigits:
                                2,
                            maximumFractionDigits:
                                2
                        }
                    ) + " min";

        }


        /* =================================================
           8. JAM DAN TANGGAL
           ================================================= */

        function updateClock() {

            var now =
                new Date();


            document
                .getElementById(
                    "dashboard-date"
                )
                .textContent =
                    now.toLocaleDateString(
                        "id-ID",
                        {
                            day: "2-digit",
                            month: "long",
                            year: "numeric"
                        }
                    );


            document
                .getElementById(
                    "dashboard-time"
                )
                .textContent =
                    now.toLocaleTimeString(
                        "id-ID",
                        {
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit"
                        }
                    );

        }


        updateStatistics();

        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /* =================================================
           9. REFRESH UKURAN PETA
           ================================================= */

        setTimeout(
            function () {

                if (
                    typeof map !==
                    "undefined"
                ) {

                    map.invalidateSize();

                }

            },
            500
        );

    }


    /* =====================================================
       JALANKAN
       ===================================================== */

    tungguPeta(
        buatDashboard
    );


})();
</script>

<script>
(function () {

    function pasangLogo() {

        var logo = document.getElementById("sidebar-logo");

        if (!logo) {
            setTimeout(pasangLogo, 300);
            return;
        }

        var daftarLogo = [
            "images/logo-antam.png",
            "images/Antam Logo - Colored - zonalogo.com (1).png",
            "images/Antam%20Logo%20-%20Colored%20-%20zonalogo.com%20%281%29.png",
            "logo-antam.png",
            "Antam Logo - Colored - zonalogo.com (1).png"
        ];

        var nomor = 0;

        function cobaLogo() {

            if (nomor >= daftarLogo.length) {
                console.error("Logo ANTAM tidak ditemukan.");
                return;
            }

            var alamat = daftarLogo[nomor];
            var gambar = new Image();

            gambar.onload = function () {
                logo.src = alamat;
                console.log("Logo ANTAM ditemukan:", alamat);
            };

            gambar.onerror = function () {
                nomor++;
                cobaLogo();
            };

            gambar.src = alamat;
        }

        cobaLogo();

    }

    pasangLogo();

})();
</script>
