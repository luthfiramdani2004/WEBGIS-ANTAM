	<script>
/* ============================================================
   INTEGRASI DASHBOARD LAMA → PETA TERBARU
   ============================================================ */

document.addEventListener("DOMContentLoaded", function () {

    /* ------------------------------------------------------------
       1. TOGGLE SIDEBAR DASHBOARD
       ------------------------------------------------------------ */
    const sidebarToggle = document.getElementById("sidebar-toggle");

    if (sidebarToggle) {
        sidebarToggle.addEventListener("click", function () {
            document.body.classList.toggle("sidebar-closed");

            // Beri waktu CSS melakukan perubahan ukuran
            setTimeout(function () {
                if (typeof map !== "undefined" && map) {
                    map.invalidateSize();
                }
            }, 300);
        });
    }


    /* ------------------------------------------------------------
       2. FILTER JENIS JALAN
       Data terbaru:
       layer_Rute_Antam_1
       field:
       Jenis_Jala
       ------------------------------------------------------------ */

    const filterJenisJalan =
        document.getElementById("jenis-jalan-filter");

    if (
        filterJenisJalan &&
        typeof json_Rute_Antam_1 !== "undefined"
    ) {

        const jenisJalan = new Set();

        json_Rute_Antam_1.features.forEach(function (feature) {

            if (
                feature.properties &&
                feature.properties["Jenis_Jala"] !== null &&
                feature.properties["Jenis_Jala"] !== undefined
            ) {

                jenisJalan.add(
                    String(feature.properties["Jenis_Jala"])
                );

            }

        });

        filterJenisJalan.innerHTML =
            '<option value="Semua Jenis">Semua Jenis</option>';

        [...jenisJalan]
            .sort()
            .forEach(function (jenis) {

                const option =
                    document.createElement("option");

                option.value = jenis;
                option.textContent = jenis;

                filterJenisJalan.appendChild(option);

            });


        /* --------------------------------------------------------
           3. JALANKAN FILTER
           -------------------------------------------------------- */

        filterJenisJalan.addEventListener(
            "change",
            function () {

                const selected =
                    this.value;

                if (
                    typeof layer_Rute_Antam_1 === "undefined"
                ) {
                    return;
                }

                layer_Rute_Antam_1.eachLayer(
                    function (layer) {

                        if (!layer.feature) return;

                        const properties =
                            layer.feature.properties || {};

                        const jenis =
                            String(
                                properties["Jenis_Jala"] ?? ""
                            );

                        const tampil =
                            selected === "Semua Jenis" ||
                            jenis === selected;

                        if (layer.setStyle) {

                            layer.setStyle({

                                opacity:
                                    tampil ? 1 : 0,

                                fillOpacity:
                                    tampil ? 1 : 0

                            });

                        }

                    }
                );

                updateDashboardStats();

            }
        );

    }


    /* ------------------------------------------------------------
       4. UPDATE STATISTIK DASHBOARD
       ------------------------------------------------------------ */

    function updateDashboardStats() {

        if (
            typeof layer_Rute_Antam_1 === "undefined"
        ) {
            return;
        }

        const filter =
            document.getElementById(
                "jenis-jalan-filter"
            );

        const selected =
            filter
                ? filter.value
                : "Semua Jenis";


        let totalRuas = 0;
        let totalPanjang = 0;
        let totalDriveTime = 0;


        layer_Rute_Antam_1.eachLayer(
            function (layer) {

                if (!layer.feature) return;

                const p =
                    layer.feature.properties || {};

                const jenis =
                    String(
                        p["Jenis_Jala"] ?? ""
                    );

                if (
                    selected !== "Semua Jenis" &&
                    jenis !== selected
                ) {
                    return;
                }


                totalRuas++;


                const panjang =
                    Number(
                        p["Shape_Length"]
                    );

                if (!isNaN(panjang)) {
                    totalPanjang += panjang;
                }


                const driveTime =
                    Number(
                        p["Drive_Time"]
                    );

                if (!isNaN(driveTime)) {
                    totalDriveTime += driveTime;
                }

            }
        );


        const rataDriveTime =
            totalRuas > 0
                ? totalDriveTime / totalRuas
                : 0;


        /* --------------------------------------------------------
           MASUKKAN HASIL KE CARD DASHBOARD LAMA
           -------------------------------------------------------- */

        const ruas =
            document.getElementById(
                "total-ruas"
            );

        const panjang =
            document.getElementById(
                "total-panjang"
            );

        const drive =
            document.getElementById(
                "total-drive-time"
            );

        const rata =
            document.getElementById(
                "rata-drive-time"
            );


        if (ruas) {

            ruas.textContent =
                totalRuas.toLocaleString(
                    "id-ID"
                );

        }


        if (panjang) {

            panjang.textContent =
                (
                    totalPanjang / 1000
                ).toLocaleString(
                    "id-ID",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                ) + " km";

        }


        if (drive) {

            drive.textContent =
                totalDriveTime.toLocaleString(
                    "id-ID",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                ) + " min";

        }


        if (rata) {

            rata.textContent =
                rataDriveTime.toLocaleString(
                    "id-ID",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                ) + " min";

        }

    }


    /* ------------------------------------------------------------
       5. TOGGLE LAYER DASHBOARD LAMA
       → MENGGUNAKAN LAYER PETA TERBARU
       ------------------------------------------------------------ */

    const layerMapping = {

        "Rute Antam":
            "layer_Rute_Antam_1",

        "Jalur Titik Kumpul":
            "layer_JALUR_TITIK_KUMPUL_2",

        "Titik Kumpul":
            "layer_TITIK_KUMPUL_Sementara_3",

        "Titik Administrasi":
            "layer_Titik_Admin_4",

        "Layer Tambahan":
            "layer_new_layer_5"

    };


    document
        .querySelectorAll(
            "#sidebar input[type='checkbox']"
        )
        .forEach(function (checkbox) {

            checkbox.addEventListener(
                "change",
                function () {

                    const label =
                        this.closest(".filter-row");

                    if (!label) return;

                    const text =
                        label.textContent
                            .trim();

                    let variableName = null;


                    Object.keys(
                        layerMapping
                    ).forEach(function (nama) {

                        if (
                            text
                                .toLowerCase()
                                .includes(
                                    nama.toLowerCase()
                                )
                        ) {

                            variableName =
                                layerMapping[nama];

                        }

                    });


                    if (!variableName) {
                        return;
                    }


                    const layer =
                        window[variableName];


                    if (
                        !layer ||
                        typeof map === "undefined"
                    ) {
                        return;
                    }


                    if (this.checked) {

                        if (
                            !map.hasLayer(layer)
                        ) {

                            map.addLayer(layer);

                        }

                    } else {

                        if (
                            map.hasLayer(layer)
                        ) {

                            map.removeLayer(layer);

                        }

                    }

                }
            );

        });


    /* ------------------------------------------------------------
       6. JAM & TANGGAL DASHBOARD
       ------------------------------------------------------------ */

    function updateClock() {

        const sekarang =
            new Date();


        const tanggal =
            sekarang.toLocaleDateString(
                "id-ID",
                {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );


        const waktu =
            sekarang.toLocaleTimeString(
                "id-ID",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );


        const dateElement =
            document.getElementById(
                "dashboard-date"
            );

        const timeElement =
            document.getElementById(
                "dashboard-time"
            );


        if (dateElement) {

            dateElement.textContent =
                tanggal;

        }


        if (timeElement) {

            timeElement.textContent =
                waktu;

        }

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /* ------------------------------------------------------------
       7. INISIALISASI
       ------------------------------------------------------------ */

    setTimeout(
        function () {

            updateDashboardStats();

            if (
                typeof map !== "undefined" &&
                map
            ) {

                map.invalidateSize();

            }

        },
        1000
    );

});
</script>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:8
        }).fitBounds([[-6.686011215586327,106.53513863237494],[-6.6548151387358745,106.578278842097]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatelit_0');
        map.getPane('pane_GoogleSatelit_0').style.zIndex = 400;
        var layer_GoogleSatelit_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelit_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 8,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer_GoogleSatelit_0;
        map.addLayer(layer_GoogleSatelit_0);
        function pop_Rute_Antam_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Jenis_Jala</th>\
                        <td class="visible-with-data" id="Jenis_Jala">' + (feature.properties['Jenis_Jala'] !== null ? autolinker.link(String(feature.properties['Jenis_Jala']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Drive_Time</th>\
                        <td class="visible-with-data" id="Drive_Time">' + (feature.properties['Drive_Time'] !== null ? autolinker.link(String(feature.properties['Drive_Time']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Rute_Antam_1_0() {
            return {
                pane: 'pane_Rute_Antam_1',
                interactive: true,
            }
        }
        map.createPane('pane_Rute_Antam_1');
        map.getPane('pane_Rute_Antam_1').style.zIndex = 401;
        map.getPane('pane_Rute_Antam_1').style['mix-blend-mode'] = 'normal';
        var layer_Rute_Antam_1 = new L.geoJson(json_Rute_Antam_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Rute_Antam_1',
            layerName: 'layer_Rute_Antam_1',
            pane: 'pane_Rute_Antam_1',
            onEachFeature: pop_Rute_Antam_1,
            style: style_Rute_Antam_1_0,
        });
        bounds_group.addLayer(layer_Rute_Antam_1);
        map.addLayer(layer_Rute_Antam_1);
        function pop_JALUR_TITIK_KUMPUL_2(feature, layer) {

                            e.target._eventParents[i].resetStyle(e.target);
                        }

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_JALUR_TITIK_KUMPUL_2_0() {
            return {
                pane: 'pane_JALUR_TITIK_KUMPUL_2',
                interactive: false,
            }
        }
        map.createPane('pane_JALUR_TITIK_KUMPUL_2');
        map.getPane('pane_JALUR_TITIK_KUMPUL_2').style.zIndex = 402;
        map.getPane('pane_JALUR_TITIK_KUMPUL_2').style['mix-blend-mode'] = 'normal';
        var layer_JALUR_TITIK_KUMPUL_2 = new L.geoJson(json_JALUR_TITIK_KUMPUL_2, {

            layerName: 'layer_JALUR_TITIK_KUMPUL_2',
            pane: 'pane_JALUR_TITIK_KUMPUL_2',
            onEachFeature: pop_JALUR_TITIK_KUMPUL_2,
            style: style_JALUR_TITIK_KUMPUL_2_0,
        });
        bounds_group.addLayer(layer_JALUR_TITIK_KUMPUL_2);
        map.addLayer(layer_JALUR_TITIK_KUMPUL_2);
        function pop_TITIK_KUMPUL_Sementara_3(feature, layer) {

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_TITIK_KUMPUL_Sementara_3_0() {
            return {
                pane: 'pane_TITIK_KUMPUL_Sementara_3',
        rotationAngle: 0.0,
        rotationOrigin: 'center center',
        icon: L.icon({
            iconUrl: 'markers/TITIK_KUMPUL_Sementara_3.svg',

        map.createPane('pane_TITIK_KUMPUL_Sementara_3');
        map.getPane('pane_TITIK_KUMPUL_Sementara_3').style.zIndex = 403;
        map.getPane('pane_TITIK_KUMPUL_Sementara_3').style['mix-blend-mode'] = 'normal';
        var layer_TITIK_KUMPUL_Sementara_3 = new L.geoJson(json_TITIK_KUMPUL_Sementara_3, {
            attribution: '',

            dataVar: 'json_TITIK_KUMPUL_Sementara_3',

            onEachFeature: pop_TITIK_KUMPUL_Sementara_3,
            pointToLayer: function (feature, latlng) {
                var context = {

                };
                return L.marker(latlng, style_TITIK_KUMPUL_Sementara_3_0(feature));

        bounds_group.addLayer(layer_TITIK_KUMPUL_Sementara_3);

        function pop_Titik_Admin_4(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Titik_Admin_4_0() {
            return {
                pane: 'pane_Titik_Admin_4',
        rotationAngle: 0.0,

        }),

        var layer_Titik_Admin_4 = new L.geoJson(json_Titik_Admin_4, {

            pointToLayer: function (feature, latlng) {

            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Faskes</th>\
                        <td class="visible-with-data" id="Faskes">' + (feature.properties['Faskes'] !== null ? autolinker.link(String(feature.properties['Faskes']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        var layer_new_layer_5 = new L.geoJson.multiStyle(json_new_layer_5, {
            attribution: '',
            interactive: true,
            dataVar: 'json_new_layer_5',
            layerName: 'layer_new_layer_5',
