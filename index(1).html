        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<script>
/* ============================================================
   DASHBOARD ANTAM PONGKOR
   Self-contained dashboard layer for GitHub Pages.
   It creates the old dashboard UI and connects it to the
   newest QGIS2Web layers.
   ============================================================ */

(function () {
    "use strict";

    var DATA = {
        roadLayer: "layer_Rute_Antam_1",
        roadJson: "json_Rute_Antam_1",
        routeLayer: "layer_JALUR_TITIK_KUMPUL_2",
        gatheringLayer: "layer_TITIK_KUMPUL_Sementara_3",
        adminLayer: "layer_Titik_Admin_4",
        extraLayer: "layer_new_layer_5"
    };

    function get(name) {
        return window[name];
    }

    function waitForMap(callback, tries) {
        tries = tries || 0;

        if (get("map") && get(DATA.roadLayer)) {
            callback();
            return;
        }

        if (tries > 100) {
            console.warn("Dashboard Antam: layer QGIS2Web belum ditemukan.");
            return;
        }

        setTimeout(function () {
            waitForMap(callback, tries + 1);
        }, 150);
    }

    function injectCSS() {
        if (document.getElementById("dashboard-antam-runtime-css")) return;

        var style = document.createElement("style");
        style.id = "dashboard-antam-runtime-css";
        style.textContent = `
            /* ===== DASHBOARD ANTAM RUNTIME ===== */
            #antam-dashboard-root {
                position: fixed;
                inset: 0;
                z-index: 2000;
                pointer-events: none;
                font-family: Arial, Helvetica, sans-serif;
            }

            #antam-header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 64px;
                background: rgba(255,255,255,.97);
                border-bottom: 1px solid #d7e3e3;
                box-shadow: 0 2px 10px rgba(0,0,0,.14);
                display: flex;
                align-items: center;
                pointer-events: auto;
                box-sizing: border-box;
                padding: 7px 18px;
            }

            #antam-logo {
                height: 46px;
                width: auto;
                object-fit: contain;
                margin-right: 12px;
            }

            #antam-title {
                line-height: 1.1;
            }

            #antam-title strong {
                display: block;
                font-size: 18px;
                color: #006b6b;
                font-weight: 800;
            }

            #antam-title span {
                display: block;
                font-size: 11px;
                color: #647272;
                margin-top: 3px;
            }

            #antam-sidebar {
                position: absolute;
                top: 74px;
                left: 10px;
                width: 250px;
                max-height: calc(100vh - 84px);
                overflow-y: auto;
                background: rgba(255,255,255,.96);
                border: 1px solid #d6e3e3;
                border-radius: 11px;
                box-shadow: 0 4px 18px rgba(0,0,0,.18);
                pointer-events: auto;
                box-sizing: border-box;
                padding: 12px;
                transition: transform .25s ease, opacity .25s ease;
            }

            #antam-sidebar.closed {
                transform: translateX(-270px);
                opacity: .2;
            }

            #antam-sidebar-toggle {
                position: absolute;
                top: 84px;
                left: 265px;
                width: 34px;
                height: 34px;
                border: 0;
                border-radius: 0 8px 8px 0;
                background: #006b6b;
                color: #fff;
                font-size: 18px;
                cursor: pointer;
                pointer-events: auto;
                box-shadow: 2px 3px 9px rgba(0,0,0,.2);
            }

            .antam-section {
                margin-bottom: 12px;
            }

            .antam-section-title {
                font-size: 11px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: .4px;
                color: #006b6b;
                border-bottom: 1px solid #dbe7e7;
                padding-bottom: 6px;
                margin-bottom: 8px;
            }

            .antam-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 3px;
                font-size: 12px;
                color: #374747;
            }

            .antam-row input {
                accent-color: #008c8c;
            }

            #antam-filter {
                width: 100%;
                box-sizing: border-box;
                border: 1px solid #cbdada;
                border-radius: 6px;
                padding: 7px 8px;
                font-size: 12px;
                background: white;
            }

            #antam-stats {
                position: absolute;
                top: 76px;
                left: 280px;
                right: 12px;
                display: grid;
                grid-template-columns: repeat(4, minmax(130px, 1fr));
                gap: 9px;
                pointer-events: none;
            }

            .antam-card {
                background: rgba(255,255,255,.95);
                border: 1px solid #d5e1e1;
                border-left: 4px solid #008c8c;
                border-radius: 9px;
                box-shadow: 0 3px 12px rgba(0,0,0,.14);
                padding: 8px 11px;
                min-width: 0;
            }

            .antam-card-label {
                font-size: 9px;
                text-transform: uppercase;
                font-weight: 800;
                color: #647272;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .antam-card-value {
                font-size: 17px;
                font-weight: 800;
                color: #004e4e;
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #antam-clock {
                margin-left: auto;
                text-align: right;
                color: #526060;
                font-size: 10px;
                line-height: 1.4;
            }

            #antam-clock strong {
                color: #006b6b;
                font-size: 12px;
            }

            @media (max-width: 900px) {
                #antam-stats {
                    left: 275px;
                    grid-template-columns: repeat(2, minmax(120px, 1fr));
                }
            }

            @media (max-width: 650px) {
                #antam-title span {
                    display: none;
                }

                #antam-title strong {
                    font-size: 14px;
                }

                #antam-logo {
                    height: 38px;
                }

                #antam-stats {
                    left: 10px;
                    top: 74px;
                    grid-template-columns: repeat(2, minmax(110px, 1fr));
                }

                #antam-sidebar {
                    width: 230px;
                }

                #antam-sidebar-toggle {
                    left: 240px;
                }
            }
        `;
        document.head.appendChild(style);
    }

    function buildHTML() {
        if (document.getElementById("antam-dashboard-root")) return;

        var root = document.createElement("div");
        root.id = "antam-dashboard-root";

        root.innerHTML = `
            <header id="antam-header">
                <img id="antam-logo"
                     src="images/Antam-Logo-Colored.png"
                     alt="ANTAM"
                     onerror="this.style.display='none'">

                <div id="antam-title">
                    <strong>Dashboard WebGIS ANTAM Pongkor</strong>
                    <span>Monitoring Jaringan Jalan, Titik Kumpul dan Administrasi</span>
                </div>

                <div id="antam-clock">
                    <div id="antam-date">-</div>
                    <strong id="antam-time">-</strong>
                </div>
            </header>

            <aside id="antam-sidebar">
                <div class="antam-section">
                    <div class="antam-section-title">Filter Jenis Jalan</div>
                    <select id="antam-filter">
                        <option value="Semua Jenis">Semua Jenis</option>
                    </select>
                </div>

                <div class="antam-section">
                    <div class="antam-section-title">Layer Peta</div>

                    <label class="antam-row">
                        <input type="checkbox"
                               data-layer="roadLayer" checked>
                        <span>Rute Antam</span>
                    </label>

                    <label class="antam-row">
                        <input type="checkbox"
                               data-layer="routeLayer" checked>
                        <span>Jalur Titik Kumpul</span>
                    </label>

                    <label class="antam-row">
                        <input type="checkbox"
                               data-layer="gatheringLayer" checked>
                        <span>Titik Kumpul</span>
                    </label>

                    <label class="antam-row">
                        <input type="checkbox"
                               data-layer="adminLayer" checked>
                        <span>Titik Administrasi</span>
                    </label>

                    <label class="antam-row">
                        <input type="checkbox"
                               data-layer="extraLayer" checked>
                        <span>Layer Tambahan</span>
                    </label>
                </div>

                <div class="antam-section">
                    <div class="antam-section-title">Informasi</div>
                    <div style="font-size:11px;line-height:1.5;color:#647272;">
                        Gunakan filter untuk melihat ruas jalan berdasarkan
                        jenisnya. Layer dapat dinyalakan atau dimatikan
                        melalui panel ini.
                    </div>
                </div>
            </aside>

            <button id="antam-sidebar-toggle" title="Tampilkan/sembunyikan panel">
                ☰
            </button>

            <section id="antam-stats">
                <div class="antam-card">
                    <div class="antam-card-label">Total Ruas Jalan</div>
                    <div class="antam-card-value" id="antam-total-ruas">0</div>
                </div>

                <div class="antam-card">
                    <div class="antam-card-label">Total Panjang Jalan</div>
                    <div class="antam-card-value" id="antam-total-panjang">0 km</div>
                </div>

                <div class="antam-card">
                    <div class="antam-card-label">Total Drive Time</div>
                    <div class="antam-card-value" id="antam-total-drive">0 min</div>
                </div>

                <div class="antam-card">
                    <div class="antam-card-label">Rata-rata Drive Time</div>
                    <div class="antam-card-value" id="antam-rata-drive">0 min</div>
                </div>
            </section>
        `;

        document.body.appendChild(root);
    }

    function setLayer(layer, visible) {
        var map = get("map");
        if (!map || !layer) return;

        if (visible && !map.hasLayer(layer)) {
            map.addLayer(layer);
        }

        if (!visible && map.hasLayer(layer)) {
            map.removeLayer(layer);
        }
    }

    function populateFilter() {
        var select = document.getElementById("antam-filter");
        var json = get(DATA.roadJson);

        if (!select || !json || !json.features) return;

        var values = {};

        json.features.forEach(function (feature) {
            var value = feature.properties &&
                        feature.properties["Jenis_Jala"];

            if (value !== null &&
                value !== undefined &&
                String(value).trim() !== "") {
                values[String(value)] = true;
            }
        });

        Object.keys(values)
            .sort(function (a, b) {
                return a.localeCompare(b, "id");
            })
            .forEach(function (value) {
                var option = document.createElement("option");
                option.value = value;
                option.textContent = value;
                select.appendChild(option);
            });

        select.addEventListener("change", applyFilter);
    }

    function applyFilter() {
        var selected =
            document.getElementById("antam-filter").value;

        var layer = get(DATA.roadLayer);
        if (!layer || !layer.eachLayer) return;

        layer.eachLayer(function (item) {
            if (!item.feature) return;

            var p = item.feature.properties || {};
            var jenis = String(p["Jenis_Jala"] ?? "");

            var show =
                selected === "Semua Jenis" ||
                jenis === selected;

            if (item.setStyle) {
                item.setStyle({
                    opacity: show ? 1 : 0,
                    fillOpacity: show ? 1 : 0
                });
            }
        });

        updateStats();
    }

    function updateStats() {
        var layer = get(DATA.roadLayer);
        if (!layer || !layer.eachLayer) return;

        var selected =
            document.getElementById("antam-filter")
                ? document.getElementById("antam-filter").value
                : "Semua Jenis";

        var ruas = 0;
        var panjang = 0;
        var drive = 0;

        layer.eachLayer(function (item) {
            if (!item.feature) return;

            var p = item.feature.properties || {};
            var jenis = String(p["Jenis_Jala"] ?? "");

            if (selected !== "Semua Jenis" &&
                jenis !== selected) return;

            ruas++;

            var len = Number(p["Shape_Length"]);
            if (Number.isFinite(len)) panjang += len;

            var dt = Number(p["Drive_Time"]);
            if (Number.isFinite(dt)) drive += dt;
        });

        var avg = ruas ? drive / ruas : 0;

        document.getElementById("antam-total-ruas").textContent =
            ruas.toLocaleString("id-ID");

        document.getElementById("antam-total-panjang").textContent =
            (panjang / 1000).toLocaleString("id-ID", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " km";

        document.getElementById("antam-total-drive").textContent =
            drive.toLocaleString("id-ID", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " min";

        document.getElementById("antam-rata-drive").textContent =
            avg.toLocaleString("id-ID", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " min";
    }

    function bindLayerControls() {
        var controls =
            document.querySelectorAll(
                "#antam-sidebar input[data-layer]"
            );

        controls.forEach(function (input) {
            var key = input.getAttribute("data-layer");
            var layerName = DATA[key];

            input.addEventListener("change", function () {
                setLayer(get(layerName), input.checked);
            });

            var layer = get(layerName);
            var map = get("map");

            if (layer && map) {
                input.checked = map.hasLayer(layer);
            }
        });
    }

    function updateClock() {
        var now = new Date();

        document.getElementById("antam-date").textContent =
            now.toLocaleDateString("id-ID", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

        document.getElementById("antam-time").textContent =
            now.toLocaleTimeString("id-ID", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
    }

    function bindSidebar() {
        var button =
            document.getElementById("antam-sidebar-toggle");

        var sidebar =
            document.getElementById("antam-sidebar");

        if (!button || !sidebar) return;

        button.addEventListener("click", function () {
            sidebar.classList.toggle("closed");

            setTimeout(function () {
                var map = get("map");
                if (map) map.invalidateSize();
            }, 300);
        });
    }

    function init() {
        injectCSS();
        buildHTML();
        bindSidebar();
        populateFilter();
        bindLayerControls();
        updateStats();
        updateClock();

        setInterval(updateClock, 1000);

        var map = get("map");
        if (map) {
            setTimeout(function () {
                map.invalidateSize();
            }, 500);
        }
    }

    waitForMap(init);
})();

</script>

</body>
</html>
